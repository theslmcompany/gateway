name: Deploy landing to Firebase Hosting

# Auto-deploy the marketing site (theslmcompany.com) on merge to master.
# Only fires when files under landing/ change.
on:
  push:
    branches: [master]
    paths:
      - "landing/**"
  workflow_dispatch: # allow manual runs from the Actions tab

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: landing/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Stamp a unique marker so the build content always differs from the
      # current active version — avoids Firebase's FAILED_PRECONDITION dedup
      # error when source changes don't alter the bundled output.
      - name: Stamp build version
        run: echo "${{ github.sha }} ${{ github.run_id }}-${{ github.run_attempt }}" > dist/build-version.txt

      - name: Deploy to Firebase Hosting (live)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AIGATEWAY_001 }}
          projectId: aigateway-001
          channelId: live
          entryPoint: ./landing
