name: Security scan

# E13.S1 — the vulnerability gate. Fails the build on reachable High/Critical
# findings; everything unreachable or accepted is allowlisted in-repo next to a
# written justification (pnpm `auditConfig.ignoreGhsas`, `#nosec` comments)
# rather than muted here. Also satisfies E7.S4 (SAST in CI) via the gosec +
# staticcheck job — do not build a second pipeline for it.

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "0 3 * * *" # nightly — catches advisories published after merge
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.5"

jobs:
  # ── Go: reachable-vulnerability analysis ────────────────────────────────────
  govulncheck:
    name: govulncheck (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [backend, cli]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ matrix.module }}/go.sum
      # govulncheck reports only vulnerabilities the code actually calls, so a
      # non-zero exit here means a reachable finding — always a real failure.
      - name: govulncheck
        working-directory: ${{ matrix.module }}
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # ── Go: static application security testing ────────────────────────────────
  go-sast:
    name: gosec + staticcheck (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [backend, cli]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: gosec
        working-directory: ${{ matrix.module }}
        run: go run github.com/securego/gosec/v2/cmd/gosec@latest -severity=medium -quiet ./...
      - name: staticcheck
        working-directory: ${{ matrix.module }}
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...

  # ── JavaScript workspaces ──────────────────────────────────────────────────
  pnpm-audit:
    name: pnpm audit (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [frontend, landing, docs]
    defaults:
      run:
        working-directory: ${{ matrix.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ${{ matrix.workspace }}/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Gate: High and above. Accepted risks live in each workspace's
      # pnpm-workspace.yaml under auditConfig.ignoreGhsas, with the reasoning.
      - name: Audit (gate)
        run: pnpm audit --audit-level high
      # Visibility: the full picture, including moderates and allowlisted
      # entries. Never blocks — silence here would read as "nothing left".
      - name: Audit (full report, non-blocking)
        if: always()
        run: pnpm audit || true

  # ── Python sidecar ─────────────────────────────────────────────────────────
  pip-audit:
    name: pip-audit (mlrunner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11" # matches services/mlrunner/Dockerfile
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit requirements
        run: pip-audit -r backend/services/mlrunner/requirements.txt

  # ── Container images (E13.S8) ──────────────────────────────────────────────
  trivy:
    name: trivy (${{ matrix.image.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: backend
            context: backend
            dockerfile: backend/Dockerfile
          - name: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
          - name: docs
            context: docs
            dockerfile: docs/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t scan-target:${{ matrix.image.name }} -f ${{ matrix.image.dockerfile }} ${{ matrix.image.context }}
      - name: Scan image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: scan-target:${{ matrix.image.name }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true # an unfixed base-image CVE is not actionable here
          exit-code: "1"

  # mlrunner is scanned as its base image rather than a built image: its
  # Dockerfile bakes torch plus a 1.2 GB model into the layer, which is far too
  # slow for every PR. The Python packages on top are covered by the pip-audit
  # job, so nothing goes unscanned — only the layer assembly is skipped.
  trivy-mlrunner-base:
    name: trivy (mlrunner base image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan python:3.11-slim
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: python:3.11-slim
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # ── Secrets (E13.S11) ──────────────────────────────────────────────────────
  # Pair this with GitHub push protection in repo settings — CI catches a secret
  # after it is already pushed; push protection stops it reaching the remote.
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — gitleaks scans commits, not the tree
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
