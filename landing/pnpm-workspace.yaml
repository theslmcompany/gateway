# Security overrides — E13.S6.
#
# firebase transitives: @firebase/database -> faye-websocket -> websocket-driver
# and @firebase/firestore -> @grpc/grpc-js -> protobufjs. This app imports only
# firebase/app and firebase/analytics, so the vulnerable code is tree-shaken out
# of the shipped bundle — pinned anyway so a future import cannot silently
# reintroduce the CVEs.
#
# brace-expansion / js-yaml arrive via eslint and typescript-eslint. Build-time
# only, but cheap to pin.
#
# react-router GHSA-qwww-vcr4-c8h2 was previously carried here as an accepted
# risk (RSC-mode only, and this is a client-side BrowserRouter SPA). It is now
# actually fixed — migrated to react-router 8 — so the allowlist entry is gone.
# Nothing in this workspace is allowlisted any more.
overrides:
  websocket-driver: '>=0.7.5'
  '@grpc/grpc-js': '>=1.14.4'
  protobufjs: '>=7.6.5 <8'
  '@protobufjs/utf8': '>=1.1.1'
  brace-expansion: '>=5.0.9'
  js-yaml: '>=4.3.1'
  # Dev-only, via eslint-plugin-react-hooks. GHSA-4x5r-pxfx-6jf8.
  '@babel/core': '>=7.29.6'
